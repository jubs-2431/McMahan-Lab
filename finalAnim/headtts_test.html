<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HeadTTS Compatibility Test</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f4f6;
        --surface: #ffffff;
        --border: #d1d5db;
        --text: #111827;
        --muted: #4b5563;
        --primary: #1f4f8a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
      }
      #avatar {
        min-height: 100vh;
        background: #dfe5ed;
      }
      aside {
        border-left: 1px solid var(--border);
        background: var(--surface);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 1.1rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.45;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 0.86rem;
        font-weight: 700;
      }
      select,
      textarea,
      button {
        font: inherit;
      }
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.65rem;
      }
      textarea {
        min-height: 88px;
        resize: vertical;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 0.75rem 0.9rem;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #374151;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        white-space: pre-wrap;
        min-height: 7rem;
        padding: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f9fafb;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.4;
      }
      @media (max-width: 840px) {
        body {
          grid-template-columns: 1fr;
        }
        #avatar {
          min-height: 58vh;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--border);
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs",
          "headtts": "https://cdn.jsdelivr.net/npm/@met4citizen/headtts@1.3/+esm"
        }
      }
    </script>
  </head>
  <body>
    <main id="avatar"></main>
    <aside>
      <h1>HeadTTS test</h1>
      <p>
        Uses TalkingHead for the avatar and HeadTTS for browser-side speech,
        timestamps, and visemes. Deepgram is not called on this page.
      </p>
      <label>
        Avatar
        <select id="avatar-select">
          <option
            value="https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/avatars/brunette.glb"
            data-body="F"
          >
            TalkingHead demo avatar
          </option>
          <option value="/kevin.glb" data-body="M">Kevin, local rig test</option>
          <option value="/female.glb" data-body="F">Female</option>
        </select>
      </label>
      <label>
        Voice
        <select id="voice-select">
          <option value="am_fenrir">am_fenrir</option>
          <option value="am_puck">am_puck</option>
          <option value="af_bella">af_bella</option>
          <option value="af_sarah">af_sarah</option>
        </select>
      </label>
      <button id="load">Load avatar + HeadTTS</button>
      <label>
        Test line
        <textarea id="prompt">Say this naturally: I can look around, move a little, and speak with synchronized mouth shapes.</textarea>
      </label>
      <button id="speak" disabled>Ask server + speak with HeadTTS</button>
      <button id="direct" class="secondary" disabled>Speak typed text only</button>
      <div id="status">Ready.</div>
    </aside>
    <script type="module">
      import { TalkingHead } from "talkinghead";
      import { HeadTTS } from "headtts";

      const avatarNode = document.getElementById("avatar");
      const avatarSelect = document.getElementById("avatar-select");
      const voiceSelect = document.getElementById("voice-select");
      const loadBtn = document.getElementById("load");
      const speakBtn = document.getElementById("speak");
      const directBtn = document.getElementById("direct");
      const promptEl = document.getElementById("prompt");
      const statusEl = document.getElementById("status");

      let head = null;
      let tts = null;
      let ready = false;

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function setBusy(isBusy) {
        loadBtn.disabled = isBusy;
        speakBtn.disabled = isBusy || !ready;
        directBtn.disabled = isBusy || !ready;
      }

      function playNaturalGesture() {
        if (!head) return;
        try {
          head.playGesture?.("thumbup", 2.2);
        } catch (error) {
          try {
            head.speakEmoji?.("🙂");
          } catch {
            console.debug("TalkingHead gesture unavailable for this avatar.", error);
          }
        }
      }

      async function initHeadTTS() {
        tts = new HeadTTS({
          endpoints: ["webgpu", "wasm"],
          languages: ["en-us"],
          voices: [voiceSelect.value],
          workerModule: "https://cdn.jsdelivr.net/npm/@met4citizen/headtts@1.3/modules/worker-tts.mjs",
          dictionaryURL: "https://cdn.jsdelivr.net/npm/@met4citizen/headtts@1.3/dictionaries/",
        });
        tts.onmessage = (message) => {
          if (message.type === "audio") {
            head.speakAudio(message.data, {}, (word) => {
              if (word) setStatus(`Speaking: ${word}`);
            });
          } else if (message.type === "error") {
            setStatus(`HeadTTS error:\n${message.data?.error || JSON.stringify(message.data)}`);
          }
        };
        await tts.connect(null, (event) => {
          if (event?.loaded && event?.total) {
            const pct = Math.round((event.loaded / event.total) * 100);
            setStatus(`Loading HeadTTS model/voice... ${pct}%`);
          } else {
            setStatus("Loading HeadTTS model/voice...");
          }
        });
        await tts.setup({
          voice: voiceSelect.value,
          language: "en-us",
          speed: 1,
          audioEncoding: "wav",
        });
      }

      async function loadAll() {
        ready = false;
        setBusy(true);
        setStatus("Loading TalkingHead avatar...");
        avatarNode.textContent = "";
        head = new TalkingHead(avatarNode, {
          lipsyncModules: ["en"],
          lipsyncLang: "en",
          cameraView: "upper",
          cameraRotateEnable: false,
          cameraPanEnable: false,
          cameraZoomEnable: false,
          modelPixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        });

        const selected = avatarSelect.selectedOptions[0];
        try {
          await head.showAvatar({
            url: avatarSelect.value,
            body: selected?.dataset.body || "M",
            lipsyncLang: "en",
            avatarMood: "neutral",
            avatarIdleEyeContact: 0.35,
            avatarSpeakingEyeContact: 0.8,
            avatarSpeakingHeadMove: 0.7,
          });
          setStatus("Avatar loaded. Loading HeadTTS...");
          await initHeadTTS();
          ready = true;
          setStatus("Loaded. First HeadTTS synthesis can be slow while the model warms up.");
        } catch (error) {
          console.error(error);
          setStatus(`Load failed:\n${error?.message || error}`);
        } finally {
          setBusy(false);
        }
      }

      async function synthesize(text) {
        if (!tts || !head) return;
        await tts.setup({ voice: voiceSelect.value });
        playNaturalGesture();
        await tts.synthesize({ input: text });
      }

      async function askAndSpeak() {
        setBusy(true);
        setStatus("Requesting text reply from /api/reply...");
        try {
          const res = await fetch("/api/reply", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: promptEl.value || "Say one sentence.",
              session_id: "headtts_test",
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          setStatus(`Reply:\n${data.reply}\n\nSynthesizing with HeadTTS...`);
          await synthesize(data.reply);
        } catch (error) {
          console.error(error);
          setStatus(`Speak test failed:\n${error?.message || error}`);
        } finally {
          setBusy(false);
        }
      }

      async function speakTypedText() {
        setBusy(true);
        try {
          setStatus("Synthesizing typed text with HeadTTS...");
          await synthesize(promptEl.value || "This is a HeadTTS test.");
        } catch (error) {
          console.error(error);
          setStatus(`Direct speech failed:\n${error?.message || error}`);
        } finally {
          setBusy(false);
        }
      }

      loadBtn.addEventListener("click", loadAll);
      speakBtn.addEventListener("click", askAndSpeak);
      directBtn.addEventListener("click", speakTypedText);
      avatarSelect.addEventListener("change", loadAll);
      voiceSelect.addEventListener("change", async () => {
        if (!ready || !tts) return;
        await tts.setup({ voice: voiceSelect.value });
        setStatus(`Voice changed to ${voiceSelect.value}.`);
      });

      loadAll();
    </script>
  </body>
</html>
