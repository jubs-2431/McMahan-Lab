<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Split or Steal – Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="landing-body">
  <div class="app">
    <main class="card landing-card">
      <h1>Split or Steal</h1>
      <p class="subtitle">
        Enter the participant ID from your slip and press Play. You will stay on this page while we
        look for another player. Once a match is found, you'll be taken into
        the game.
      </p>

      <div class="landing-form">
        <label for="playerName" class="label">Participant ID</label>
        <input
          type="text"
          id="playerName"
          class="text-input"
          placeholder="e.g. P001"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        />

        <button type="button" class="btn primary landing-play-btn" id="playBtn">
          Play
        </button>

        <p class="small" id="lobbyStatus">
          Connecting to server…
        </p>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="lobby.js" defer></script>
</body>
</html>
